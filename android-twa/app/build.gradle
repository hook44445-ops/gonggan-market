plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gonggansai.gongganmarket'
    compileSdk 36

    defaultConfig {
        applicationId "com.gonggansai.gongganmarket"
        minSdk 24
        targetSdk 36
        versionCode 19
        versionName "1.0.19"
    }

    signingConfigs {
        release {
            storeFile     file('../gonggan-release.keystore')
            storePassword 'GongganMarket2026!'
            keyAlias      'gonggan-market'
            keyPassword   'GongganMarket2026!'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Play 정책상 2026-11-01 까지 targetSdk 36(Android 16) 이어야 한다. 그래서
    // compileSdk/targetSdk 만 36 으로 올리고, 라이브러리는 실기기에서 검증된 2.5.0 을
    // 그대로 둔다. 2.7.2 로 올리면 appcompat·kotlin 이 함께 끌려 들어와 dex 가
    // 849KB -> 8.9MB 로 불어나고, 예전에 2.7.2 에서 TWA 실행 직후 종료가 났던 적이
    // 있어 실기기 확인 없이 바꾸지 않는다. (2.7.x 전환은 내부 테스트로 따로 검증한다.)
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
