<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 공간마켓 앱 아이콘 v4 — 지붕 아래 견적 두 장. v3 의 사람 픽토그램을 걷어낸 판.
       색은 브랜드 값 그대로: 딥그린 #17472F · 아이보리 #F4EFE4 · 골드 #D6A756.

       지붕과 종이의 균형이 이 아이콘의 전부다.
       · 처마 끝(171·853)이 뒷장(211)보다 40 만큼만 나온다. 더 나가면 지붕이 따로 논다.
       · 처마 끝 높이(457)를 종이 윗변(474) 바로 위에 붙였다. 둘 사이 초록 틈이 넓으면
         지붕이 떠 있는 판때기로 보인다.
       · 두 장의 아랫변은 둘 다 798 — 바닥이 맞아야 «쌓여 있다»로 읽힌다.

       ★ 오른쪽 무게(앞장 폭 347)
       지붕과 뒷장이 같은 아이보리라 눈이 둘을 한 덩어리로 묶는다. 좌표상 지붕도 종이도
       정중앙 512 인데도 왼쪽이 무겁게 보이는 이유다. 지붕을 오른쪽으로 옮기면 왼쪽 처마
       끝이 뒷장 모서리와 겹쳐 오히려 왼쪽이 더 뭉친다 — 해서는 안 되는 교정이다.
       대신 앞장을 307→347 로 넓혀 오른쪽을 채웠다. 이제 처마가 뒷장 밖으로 78.5,
       앞장 밖으로 38.5 나온다 — 지붕 아래 내용물이 오른쪽에 실린다.

       앞장 테두리(26)는 두 장을 떼어놓으려는 게 아니다. 금색과 아이보리는 이미 다른 색이라
       저절로 구분된다. «앞장이 위에 얹혀 있다»는 두께감이라 얇아야 맞다. -->
  <rect width="1024" height="1024" rx="230" fill="#17472F"/>
  <path d="M171 457 L512 252 L853 457" fill="none" stroke="#F4EFE4" stroke-width="77"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="211" y="474" width="307" height="324" rx="26" fill="#F4EFE4"/>
  <rect x="493" y="525" width="347" height="273" rx="26" fill="#D6A756" stroke="#17472F" stroke-width="26"/>
</svg>
